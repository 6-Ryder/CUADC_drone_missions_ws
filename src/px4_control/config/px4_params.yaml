# PX4 飞行控制参数
# 坐标系: PX4 NED (x=前/North, y=右/East, z=下, 负值=向上)
# 原点: 解锁点 (真机=0,0,0; SITL Gazebo=4,10,0)
/px4_bridge:
  ros__parameters:
    # PX4 DDS message version is deployment-specific: real vehicle uses v1;
    # SITL launch overrides this to v4 together with a matching px4_msgs overlay.
    vehicle_status_topic: "/fmu/out/vehicle_status_v1"

    # --- 基础飞行参数 ---
    takeoff_height: 5.0           # 巡航飞行高度 (m, NED z 负值)
    waypoint_tolerance: 0.5       # 航点到达容差 (m)
    takeoff_tolerance: 0.3        # 起飞到达容差 (m)
    control_frequency: 20.0       # 控制循环频率 (Hz), 必须 >2Hz
    max_error_count: 5            # 最大错误次数, 超过则中止任务
    waypoint_timeout: 120.0       # 单航点超时 (s)
    land_altitude: 0.15           # 着陆确认高度 (m, NED z > -0.15 认为已着陆)

    # --- Bridge 位置设定点安全上限 ---
    # 任务阶段速度由 mission_params.yaml 统一配置；此值只限制其最大值。
    max_setpoint_speed_limit: 5.0 # setpoint 推进速度上限 (m/s)
