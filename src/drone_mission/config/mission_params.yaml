# 无人机自主任务飞行 — 任务参数
# 坐标系: PX4 NED (x=前/North, y=右/East, z=下, 负值=向上)
# 原点: 起飞点 H (world: 4, 10, 0)
# 飞行方向: 向北 (NED north 正方向)
/mission_state_machine:
  ros__parameters:
    # 真机当前 PX4 固件发布 v1；SITL launch 会覆盖为 v4。
    vehicle_status_topic: "/fmu/out/vehicle_status_v1"

    # --- 坐标系原点 (北向场地: World X=East, Y=North) ---
    home_x: 4.0
    home_y: 10.0
    home_z: 0.0

    # --- 任务布局 (相对 Home 的 local forward/right 坐标系) ---
    layout_heading_deg: 0.0       # local forward 相对 NED north 的顺时针角度

    # --- 任务全局参数 ---
    takeoff_height: 5.0           # 巡航飞行高度 (m, NED z 负值)
    waypoint_tolerance: 0.5       # 航点到达容差 (m)
    takeoff_tolerance: 0.3        # 起飞到达容差 (m)
    control_frequency: 20.0       # 控制循环频率 (Hz)
    max_error_count: 5            # 最大错误次数, 超过则中止任务
    waypoint_timeout: 120.0       # 单航点超时 (s)
    land_altitude: 0.15           # 着陆确认高度 (m)

    # --- 速度参数 ---
    sweep_speed: 1.2              # 区域内部遍历速度 (m/s)
    transit_speed: 2.5            # 区域之间中转速度 (m/s)
    return_speed: 3.8             # 返航速度 (m/s)

    # --- 投放控制 ---
    max_drops: 2                  # 最大投放次数 (需与 servo pwm_positions 长度-1 一致)

    # --- Area 1: 投放区 ---
    # local: forward=[30,35], right=[-4,4]
    area1_forward_min: 30.0
    area1_forward_max: 35.0
    area1_right_min: -4.0
    area1_right_max: 4.0
    area1_altitude: 2.0           # 投放区飞行高度 (m, NED z 负值)
    area1_search_altitude: 5.6    # 投放区视觉识别/目标建图高度, 高处保证相机视场覆盖

    # --- Area 2: 侦察区 ---
    # local: forward=[55,60], right=[-3,4]  (左边界右移1m: 实飞左偏 1m 补偿)
    area2_forward_min: 55.0
    area2_forward_max: 60.0
    area2_right_min: -3.0
    area2_right_max: 4.0
    area2_altitude: 2.5           # 侦察区低空扫描高度 (m, NED z 负值)

    # --- 弓字形覆盖参数 ---
    grid_spacing: 1.67            # 网格间距 (m), 对齐 PathPlanner 默认值
    sweep_margin_forward: 1.0     # forward 边界内缩 (m)
    sweep_margin_right: 0.5       # right 边界内缩 (m)
    recon_require_full_path: true # 侦察区必须走完整弓字形路径, 覆盖率仅作监控

    # --- 投放策略参数 ---
    min_radius_first: true        # 第一轮选最小半径筒
    min_drop_targets_required: 2  # 搜索阶段至少累计到的投放目标数
    cylinder_memory_merge_distance: 0.75  # 同一圆筒世界坐标合并距离 (m)
    cylinder_memory_min_observations: 1   # 目标进入候选库所需观测次数
    drop_marker_min_confidence: 0.35      # 圆筒检测不稳时蓝色投放标识兜底阈值
    drop_marker_fallback_delay: 15.0      # 搜索圆筒失败后才允许使用蓝色标识候选
    marker_memory_merge_distance: 0.75    # 同一蓝色标识世界坐标合并距离 (m)
    marker_memory_min_observations: 3     # 蓝色标识进入候选库所需观测次数
    drop_descend_height: 2.8      # 投放降高高度 (m)
    drop_confirmation_timeout: 5.0  # 必须大于舵机层 3s 总预算 (s)
    drop_align_pixel_tolerance: 35.0 # 投放前圆筒中心允许像素误差
    # ── 低空视觉校准: 梯度下降探测 ──
    drop_visual_align_probe_step: 0.40 # 单次探测步长 (m), 信号大于噪声(~30px)
    drop_visual_align_probe_speed: 0.30 # 探测移动速度 (m/s)
    drop_visual_align_probe_settle: 1.0 # 探测后稳定等待时间 (s)
    drop_visual_align_world_gate: 1.5 # 当前视觉目标与记忆目标最大匹配距离 (m)
    drop_visual_align_stable_frames: 6 # 连续居中帧数后才允许投放
    drop_visual_align_timeout: 18.0 # 低空视觉校准最长等待时间 (s)
    drop_visual_align_brake_threshold: 80.0 # pixel_error 进入此阈值后悬停 (px)
    drop_visual_align_brake_timeout: 4.0 # 刹车悬停最长持续时间 (s)
    drop_visual_align_hover_time: 2.5 # 探测提交后悬停观察时间 (s), 给 is_centered 稳定机会
    drop_visual_align_lock_tolerance: 2.0 # 目标锁定容差 (m), 锁定后只接受世界坐标在此范围内的目标
    # ── 低空视觉精校: CUADC 风格像素闭环 (默认替代梯度下降探测) ──
    precision_align_enable: true          # true=使用新精校控制器, false=回退 DropVisualAligner
    precision_align_target_source: "cylinder" # cylinder=最终投放追选中圆筒, marker 仅兜底
    precision_align_image_width: 1280.0
    precision_align_image_height: 960.0
    precision_align_alpha: 0.55           # EMA 平滑系数, 兼顾检测抖动和闭环响应
    precision_align_fine_pixel_error: 90.0 # 进入精调速度限制的像素误差
    precision_align_fine_max_speed: 0.065 # 精调水平合速度上限 (m/s)
    precision_align_step_s: 0.18          # 粗调速度脉冲持续时间 (s)
    precision_align_fine_step_s: 0.12     # 精调短脉冲, 避免越过中心
    precision_align_hover_s: 0.04         # 每步后短暂停稳并获取新观测 (s)
    precision_align_timeout: 25.0         # 单阶段低空精校最长等待时间 (s)
    precision_align_max_retries: 2        # 精校超时/丢失后低空原地重置次数
    precision_align_image_x_to_right_sign: 1.0   # +1: 图像右侧目标 → 机体右移
    precision_align_image_y_to_forward_sign: -1.0 # CUADC 标定: 图像下侧目标 → 机体后退
    precision_align_threshold_norm_x: 0.008 # 归一化水平误差阈值 (约 10.2px)
    precision_align_threshold_norm_y: 0.008 # 归一化垂直误差阈值 (约 7.7px)
    precision_align_raw_pixel_tolerance: 9.0 # 当前帧必须保持厘米级像素误差
    precision_align_smooth_pixel_tolerance: 7.0 # 平滑误差必须保持在中心附近
    precision_align_stable_frames: 5      # 连续稳定帧后进入最终刹车复查
    precision_align_final_brake_s: 0.5    # 投放前零速度悬停复查时间 (s)
    precision_align_release_max_horizontal_speed: 0.04 # 释放时最大水平速度 (m/s)
    precision_align_min_confidence: 0.25
    precision_align_target_world_gate: 1.5  # 初次锁定与粗定位记忆目标匹配的世界坐标门限 (m)
    precision_align_max_jump_diag_ratio: 0.55 # CUADC 像素跳变拒绝阈值 (占图像对角线)
    precision_align_reject_center_ratio: 0.28 # 跳变候选仍远离中心时拒绝
    precision_align_reacquire_after_lost: 12   # 丢失 N 帧后清除像素锁定, 近中心重捕获
    precision_align_max_lost_frames: 48       # 丢失超限后放弃当前目标
    precision_align_drop_height_tolerance: 0.50 # 进入精校/投放的高度误差 (m), SITL 稳态~0.42m, 需留余量
    precision_align_final_descent_enable: true  # 先在2.8m捕获, 再降至最终高度重精校
    precision_align_final_drop_height: 1.5      # 最终投放高度, 降低落体漂移和像素厘米换算
    precision_align_final_descent_speed: 0.25   # 最终降高速度 (m/s)
    precision_align_log_interval: 0.75
    cylinder_approach_fast_speed: 0.30   # 投放区视觉逼近速度, 降低以保持检测连续
    cylinder_approach_slow_speed: 0.15   # 接近对心后慢速微调
    cylinder_approach_memory_speed: 0.25 # 丢帧时向记忆圆心粗靠近速度
    camera_fx: 539.9
    camera_fy: 539.9
    camera_cx: 640.0
    camera_cy: 480.0
    image_top_faces_forward: false   # gz 相机 x500_mono_cam_down: 画面底朝机头

    # --- 精准降落参数 ---
    landing_search_altitude: 5.0  # 搜索H标识高度 (m)
    landing_approach_speed: 0.5   # 降落逼近速度 (m/s)
    landing_blind_altitude: 1.5   # 稳定对心后切入盲降高度 (m)
    landing_blind_align_tolerance_px: 30.0  # 切入盲降前最大像素误差
    landing_blind_stable_frames: 10  # 近地交接前连续位于像素死区的帧数
    landing_alignment_latch_max_altitude: 2.5  # 低于此高度才锁存对心结果
    landing_precision_target: 0.1 # 目标水平精度 (m)
    # 降落伺服 (图像空间 P 控制器, 与投放区精校同方法)
    landing_servo_deadzone_px: 12.0     # 像素死区 (px), 进入后停止水平修正
    landing_servo_x_to_right_sign: 1.0  # u轴→右移符号
    landing_servo_y_to_forward_sign: -1.0  # v轴→前飞符号 (下视相机 y轴向后)
    landing_target_min_confidence: 0.60  # 过滤近地低置信度 H 畸变
    landing_target_max_jump_px: 80.0  # 连续帧 H 中心最大允许跳变，超过则悬停
    landing_descent_fast: 0.4           # >3m 下降速度 (m/s)
    landing_descent_medium: 0.25        # 1.5-3m 下降速度 (m/s)
    landing_descent_slow: 0.12          # <1.5m 下降速度 (m/s)
    # PX4 接地检测要求下降意图 >= 1.1 * LNDMC_Z_VEL_MAX (当前为 0.275m/s)
    landing_blind_descent_speed: 0.30   # 对心后近地纯垂直 Offboard 下降速度
    landing_blind_timeout: 45.0         # 从进入盲降开始计时，超时则停止下降并报错
    # 仅 SITL 使用本地高度/速度备用接地确认；真机只接受 PX4 land_detected
    landing_touchdown_max_altitude: 0.10
    landing_touchdown_max_horizontal_speed: 0.10
    landing_touchdown_max_vertical_speed: 0.05
    landing_touchdown_hold_time: 2.0

    # --- 异常处理参数 ---
    battery_warning: 0.25         # 低电量警告阈值 (比例)
    battery_critical: 0.15        # 严重低电量阈值 (比例)
    vision_loss_timeout: 3.0      # 视觉连续丢失超时 (s)
    state_max_duration: 180.0     # 单状态最大持续时间 (s)
