# 无人机自主任务飞行 — 快速投放策略参数 (SITL 仿真)
# 基于 mission_params.yaml 覆盖: 单次降高 2.4m + marker_only 视觉 + 放宽对心 + 单次双投
# 坐标系: PX4 NED (x=前/North, y=右/East, z=下, 负值=向上)
# 原点: 起飞点 H (world: 4, 10, 0)
# 飞行方向: 向北 (NED north 正方向)
# 注意: SITL 图像 1280x960 (fx 539.9), 像素窗口 = 真机 (640x480) × 2 等比,
#        保持相同角度对心效果。norm 阈值已归一化, 无需缩放。
/mission_state_machine:
  ros__parameters:
    # 真机当前 PX4 固件发布 v1；SITL launch 会覆盖为 v4。
    vehicle_status_topic: "/fmu/out/vehicle_status_v1"

    # --- 坐标系原点 (北向场地: World X=East, Y=North) ---
    home_x: 4.0
    home_y: 10.0
    home_z: 0.0

    # --- 任务布局 (相对 Home 的 local forward/right 坐标系) ---
    layout_heading_deg: 0.0       # local forward 相对 NED north 的顺时针角度

    # --- 任务全局参数 ---
    takeoff_height: 5.0           # 巡航飞行高度 (m, NED z 负值)
    waypoint_tolerance: 0.5       # 航点到达容差 (m)
    takeoff_tolerance: 0.3        # 起飞到达容差 (m)
    control_frequency: 20.0       # 控制循环频率 (Hz)
    max_error_count: 5            # 最大错误次数, 超过则中止任务
    waypoint_timeout: 120.0       # 单航点超时 (s)
    land_altitude: 0.15           # 着陆确认高度 (m)

    # --- 速度参数 (quick: 中转/扫描提速) ---
    sweep_speed: 1.2              # 区域内部遍历速度 (原 0.8)
    transit_speed: 3.5            # 区域之间中转速度 (原 2.5, quick 提速至 3.5)
    return_speed: 4.5             # 返航速度 (m/s, quick 提速至 4.5)

    # --- 投放控制 (quick: 单次投放, 一次开舵机 1150→2150 双投) ---
    max_drops: 1                  # 最大投放次数 (需与 servo pwm_positions 长度-1 一致)

    # --- Area 1: 投放区 ---
    # local: forward=[30,35], right=[-4,4]
    area1_forward_min: 30.0
    area1_forward_max: 35.0
    area1_right_min: -4.0
    area1_right_max: 4.0
    area1_altitude: 2.0           # 投放区飞行高度 (m, NED z 负值)
    area1_search_altitude: 4.5    # 相对起飞点；与真机同步，扫描补足降低高度后的视场

    # --- Area 2: 侦察区 ---
    # local: forward=[55,60], right=[-3,4]  (左边界右移1m: 实飞左偏 1m 补偿)
    area2_forward_min: 55.0
    area2_forward_max: 60.0
    area2_right_min: -3.0
    area2_right_max: 4.0
    area2_altitude: 2.5           # 侦察区低空扫描高度 (m, NED z 负值)

    # --- 弓字形覆盖参数 ---
    grid_spacing: 1.67            # 网格间距 (m), 对齐 PathPlanner 默认值
    sweep_margin_forward: 1.0     # forward 边界内缩 (m)
    sweep_margin_right: 0.5       # right 边界内缩 (m)
    recon_require_full_path: true # 侦察区必须走完整弓字形路径, 覆盖率仅作监控

    # --- 投放策略参数 (quick: 只认蓝底标识, 1 次观测即入库) ---
    min_radius_first: true        # 第一轮选最小半径筒
    min_drop_targets_required: 1  # 任一蓝底目标即可开始投放 (原 2 个圆筒)
    cylinder_memory_merge_distance: 0.75  # 同一圆筒世界坐标合并距离 (m)
    cylinder_memory_min_observations: 1   # 目标进入候选库所需观测次数
    drop_marker_min_confidence: 0.35      # 蓝色投放标识置信度阈值
    drop_marker_fallback_delay: 0.0       # quick: 蓝底直接是主目标, 零延迟
    marker_memory_merge_distance: 0.75    # 同一蓝色标识世界坐标合并距离 (m)
    marker_memory_min_observations: 1     # 蓝底 1 次观测即入库 (原 3)
    drop_descend_height: 2.4      # 单次降高高度 (取消两级降高, 原 2.8+1.5)
    drop_descend_speed: 0.8       # 降高速度提速 (原 0.5)
    # ── 边伺服边下降 (quick: 降高同时像素 P 控制水平对心, 复用降落区伺服参数) ──
    drop_servo_descend_fast: 0.5   # 伺服下降: >3m 垂直速度 (m/s)
    drop_servo_descend_slow: 0.3   # 伺服下降: ≤3m 垂直速度 (m/s), 近投放高度减速保对心稳定
    drop_confirmation_timeout: 5.0  # 必须大于舵机层 3s 总预算 (s)
    drop_align_pixel_tolerance: 80.0 # 投放前目标中心允许像素误差 (1280 宽图像, = 真机 40px 等比)
    # ── 低空视觉校准: 梯度下降探测 (quick 下不使用, 继承 SITL 基线) ──
    drop_visual_align_probe_step: 0.40 # 单次探测步长 (m), 信号大于噪声(~30px)
    drop_visual_align_probe_speed: 0.30 # 探测移动速度 (m/s)
    drop_visual_align_probe_settle: 1.0 # 探测后稳定等待时间 (s)
    drop_visual_align_world_gate: 1.5 # 当前视觉目标与记忆目标最大匹配距离 (m)
    drop_visual_align_stable_frames: 6 # 连续居中帧数后才允许投放
    drop_visual_align_timeout: 18.0 # 低空视觉校准最长等待时间 (s)
    drop_visual_align_brake_threshold: 80.0 # pixel_error 进入此阈值后悬停 (px)
    drop_visual_align_brake_timeout: 4.0 # 刹车悬停最长持续时间 (s)
    drop_visual_align_hover_time: 2.5 # 探测提交后悬停观察时间 (s), 给 is_centered 稳定机会
    drop_visual_align_lock_tolerance: 2.0 # 目标锁定容差 (m), 锁定后只接受世界坐标在此范围内的目标
    # ── 低空视觉精校: CUADC 风格像素闭环 (quick 放宽判定) ──
    precision_align_enable: true          # true=使用新精校控制器, false=回退 DropVisualAligner
    precision_align_target_source: "marker" # quick: 只追蓝底标识
    precision_align_image_width: 1280.0
    precision_align_image_height: 960.0
    precision_align_alpha: 0.55           # EMA 平滑系数, 兼顾检测抖动和闭环响应
    precision_align_gain: 1.25            # 归一化像素误差 → 机体系速度比例
    precision_align_continuous_enable: true  # 快速投放: 下降到投放高度不中断同一目标锁
    precision_align_ground_kp: 0.40       # 地面误差(m) → 水平速度(m/s), 保持跨高度增益一致
    precision_align_max_speed: 0.25       # 粗调水平合速度上限 (m/s)
    bucket_servo_mid_max_speed: 0.14      # bucket: 1.9m<h≤3.0m 水平合速度上限 (m/s)
    bucket_blue_predescent_enable: true   # bucket: 蓝盘引导 4.5→3.0m 预降高，继续识别圆筒
    precision_align_fine_pixel_error: 90.0 # 进入精调速度限制的像素误差
    precision_align_fine_max_speed: 0.065 # 精调及 bucket ≤1.9m 水平合速度上限 (m/s)
    precision_align_min_correction_speed: 0.012 # 保证小误差修正高于飞控响应死区
    precision_align_step_s: 0.18          # 粗调速度脉冲持续时间 (s)
    precision_align_fine_step_s: 0.12     # 精调短脉冲, 避免越过中心
    precision_align_hover_s: 0.15         # 每步后短暂停稳并获取新观测 (s); 与真机一致
    precision_align_timeout: 15.0         # quick: 单阶段对心最长等待 (原 25.0)
    precision_align_max_retries: 1        # 超时/丢失后仅一次原地重置 (原 2)
    precision_align_image_x_to_right_sign: 1.0   # +1: 图像右侧目标 → 机体右移
    precision_align_image_y_to_forward_sign: -1.0 # CUADC 标定: 图像下侧目标 → 机体后退
    precision_align_threshold_norm_x: 0.06 # quick: 放宽防跳变阈值 (原 0.008 会卡死判定)
    precision_align_threshold_norm_y: 0.06 # quick: 放宽防跳变阈值
    precision_align_raw_pixel_tolerance: 80.0 # quick: 2.4m 对心窗口 (1280 宽 = 真机 40px 等比)
    precision_align_final_raw_pixel_tolerance: 80.0 # 不启用两级窗口, 兜底值
    precision_align_tight_window_height: 0.0  # quick: 两级窗口永不切换 (只用 raw 窗口)
    precision_align_smooth_pixel_tolerance: 80.0 # quick: EMA 平滑安全网放宽 (等比 40px)
    precision_align_stable_frames: 3      # quick: 连续稳定帧放宽 (原 5)
    precision_align_final_brake_s: 0.3    # quick: 投放前零速度悬停复查 (原 0.5)
    precision_align_release_max_horizontal_speed: 0.25 # quick: 释放时最大水平速度 (原 0.04 不可达)
    precision_align_min_confidence: 0.25
    precision_align_target_world_gate: 1.5  # 初次锁定与粗定位记忆目标匹配的世界坐标门限 (m)
    precision_align_max_jump_diag_ratio: 0.55 # CUADC 像素跳变拒绝阈值 (占图像对角线)
    precision_align_reject_center_ratio: 0.28 # 跳变候选仍远离中心时拒绝
    precision_align_reacquire_after_lost: 12   # 丢失 N 帧后清除像素锁定, 近中心重捕获
    precision_align_max_lost_frames: 48       # 丢失超限后放弃当前目标
    precision_align_drop_height_tolerance: 0.50 # 进入精校/投放的高度误差 (m), SITL 稳态~0.42m, 需留余量
    precision_align_final_descent_enable: false # quick: 取消两级降高, 直接 2.4m 对心投放
    precision_align_final_drop_height: 1.5      # 未使用 (final_descent 关闭)
    precision_align_final_descent_speed: 0.25   # 未使用 (final_descent 关闭)
    precision_align_fallback_max_pixel_error: 120.0 # quick 兜底: 超时重试耗尽后像素 ≤120px (等比 60px) 才直接投
    precision_align_log_interval: 0.75
    cylinder_approach_fast_speed: 0.30   # 投放区视觉逼近速度, 降低以保持检测连续
    cylinder_approach_slow_speed: 0.20   # 接近对心后慢速微调 (quick 提速至 0.20)
    cylinder_approach_memory_speed: 0.25 # 丢帧时向记忆圆心粗靠近速度
    camera_fx: 539.9
    camera_fy: 539.9
    camera_cx: 640.0
    camera_cy: 480.0
    image_top_faces_forward: false   # gz 相机 x500_mono_cam_down: 画面底朝机头

    # --- 快速投放策略 (quick_drop_mode) ---
    quick_drop_mode: true                 # 启用快速投放策略
    drop_target_source: "marker"          # 只认蓝底标识作为投放目标
    drop_align_stall_threshold: 85.0      # 停滞阈值 (raw 80 + 5 兜底)
    drop_align_stall_stable_band: 5.0     # 停滞稳定带宽 (px)
    drop_align_stall_duration: 2.0        # 停滞判定时长 (s)

    # --- 精准降落: simple 模式 (quick) ---
    # 仅连续、几何确认的 H 目标可伺服；近地丢失短暂重捕获失败 → PX4 原地 LAND
    landing_simple_mode: true
    landing_search_timeout: 15.0      # simple: H 搜索超时 → PX4 LAND (test_mission 值)
    landing_simple_blind_timeout: 60.0  # simple: 盲降超时 → PX4 LAND (test_mission 值)
    landing_target_reacquire_timeout: 1.0  # 低空目标失效后最多重捕获 1s
    landing_search_altitude: 5.0  # 搜索H标识高度 (m)
    landing_approach_speed: 0.5   # 降落逼近速度 (m/s)
    landing_blind_altitude: 1.0   # SITL: H 标识近地实测 ~0.9m 失效, 1.0m 切入盲降 (真机 0.5m)
    landing_blind_align_tolerance_px: 30.0  # 切入盲降前最大像素误差
    landing_blind_stable_frames: 10  # 近地交接前连续位于像素死区的帧数
    landing_alignment_latch_max_altitude: 2.5  # 低于此高度才锁存对心结果
    landing_visual_handoff_altitude: 1.6  # 圆形几何对心后，开始纯垂直下降高度 (m)
    landing_visual_handoff_max_ground_error_m: 0.20  # 交接前最大估算地面中心误差 (m)
    landing_visual_handoff_stable_frames: 10  # 圆心地面误差连续达标帧数
    landing_precision_target: 0.1 # 目标水平精度 (m)
    # 降落伺服 (图像空间 P 控制器, 与投放区精校同方法)
    landing_servo_kp_pixel: 0.0025      # 像素增益 (m/s body velocity per px error); 0.004→0.0025 降近地伺服速度
    landing_servo_max_horizontal_vel: 0.35  # 最大水平修正速度 (m/s); 0.6→0.35 防最后一刻大位移偏离
    landing_servo_deadzone_px: 12.0     # 像素死区 (px), 进入后停止水平修正
    landing_servo_x_to_right_sign: 1.0  # u轴→右移符号
    landing_servo_y_to_forward_sign: -1.0  # v轴→前飞符号 (下视相机 y轴向后)
    landing_target_min_confidence: 0.60  # 过滤近地低置信度 H 畸变
    landing_target_max_jump_px: 80.0  # 连续帧 H 中心最大允许跳变，超过则悬停
    landing_descent_fast: 0.5           # >3m 下降速度 (m/s, quick 提速至 0.5)
    landing_descent_medium: 0.3         # 1.5-3m 下降速度 (m/s, quick 提速至 0.3)
    landing_descent_slow: 0.15          # <1.5m 下降速度 (m/s, quick 提速至 0.15)
    # PX4 接地检测要求下降意图 >= 1.1 * LNDMC_Z_VEL_MAX (当前为 0.275m/s)
    # simple 模式用 test_mission 的 0.15 m/s (更慢但等 PX4 着陆检测更稳)
    # 注意: 盲降段视觉已关 → 3s 丢失超时先触发 → PX4 自主着陆接管 (test_mission 原样行为)
    #       landing_simple_blind_timeout 实际不可达, 落地靠 PX4 LAND, 非 PX4 is_landed
    landing_blind_descent_speed: 0.15   # simple: 近地盲降下降速度 (test_mission 值)
    landing_blind_timeout: 45.0         # 未使用 (simple 用 landing_simple_blind_timeout)
    # 仅 SITL 使用本地高度/速度备用接地确认；真机只接受 PX4 land_detected
    landing_touchdown_max_altitude: 0.10
    landing_touchdown_max_horizontal_speed: 0.10
    landing_touchdown_max_vertical_speed: 0.05
    landing_touchdown_hold_time: 2.0

    # --- 异常处理参数 ---
    battery_warning: 0.25         # 低电量警告阈值 (比例)
    battery_critical: 0.15        # 严重低电量阈值 (比例)
    vision_loss_timeout: 3.0      # 视觉连续丢失超时 (s)
    state_max_duration: 180.0     # 单状态最大持续时间 (s)
