# 无人机视觉检测参数 — YOLO + OpenCV 混合方案
/vision_pipeline:
  ros__parameters:
    # ============================================================
    # 相机内参 (需标定 — 当前为 SITL 仿真默认值)
    # ============================================================
    camera_width: 1280
    camera_height: 960
    camera_fps: 30.0
    fx: 539.9                     # hfov=1.74rad: 640/tan(0.87)
    fy: 539.9                     # 方形像素
    cx: 640.0                     # 1280/2
    cy: 480.0                     # 960/2
    sim_mode: true                # true=SITL ros_gz_bridge, false=GStreamer
    # 相机画面顶是否朝机头: false=gz x500_mono_cam_down (画面底朝机头, 旧约定);
    # 真机 real_flight.launch.py 覆盖为 true (画面顶朝机头).
    image_top_faces_forward: false
    # World 坐标投影只接受此时间窗口内收到的完整 6-DoF 位姿。
    vision_pose_max_age_s: 0.5

    # ============================================================
    # YOLO 模型参数
    # ============================================================
    # ---- YOLO 主模型 (白色圆筒检测, 单类) ----
    model_path: "cylinder_yolo.onnx"       # .pt/.onnx/.engine; 相对 models/ 或绝对路径
    model_width: 640                       # 模型输入宽
    model_height: 640                      # 模型输入高
    conf_threshold: 0.35                   # YOLO 置信度阈值 (匹配 cv_trainer 推理脚本)
    nms_iou_threshold: 0.45               # NMS IoU 阈值
    device: "cuda"                         # cuda / cpu / tensorrt (本地开发机无 TensorRT)
    max_inference_fps: 30.0                # 推理帧率上限 (当前实测未触达, 为后续单模型/TRT 加速预留)
    # 主模型类别映射: ID → 名称 (必须与模型输出类别数一致)
    class_names:
      - "cylinder"                         # 0: 白色圆筒

    # ---- 投放区蓝色标识模型 (单类, 可选) ----
    drop_marker_model_path: "drop_marker_yolo.onnx"
    drop_marker_class_names:
      - "drop_zone_marker"                 # 0: 蓝色投放区标识
    drop_marker_refine_enable: true        # YOLO bbox 内 HSV 蓝色分割 → 轮廓矩质心
    drop_marker_min_blue_ratio: 0.4        # YOLO 框内至少 40% 属于同一蓝色连通域
    drop_marker_min_area: 80               # 蓝色连通域最小像素面积
    drop_marker_min_aspect_ratio: 0.4       # 过滤过度狭长的蓝色杂物
    drop_marker_min_circularity: 0.35       # 允许透视椭圆, 拒绝线缆/长条
    # B1: 低空下降段放宽门槛 (运动模糊误杀 → 目标断裂)
    drop_marker_descend_min_blue_ratio: 0.3
    drop_marker_descend_min_circularity: 0.25
    drop_marker_descend_alt_threshold: 4.5  # 低于该高度启用放宽, 覆盖 3.15-3.75m 丢失区间
    drop_marker_min_diameter: 30            # 过滤远小于 1m 标识投影的蓝色杂物
    drop_marker_min_scale_ratio: 0.45       # 实测直径/1m理论投影下限
    drop_marker_max_scale_ratio: 1.8        # 实测直径/1m理论投影上限

    # ---- H 降落标识模型 (单类, 按需在降落阶段加载) ----
    landing_model_path: "landing_h_yolo.onnx"
    landing_class_names:
      - "landing_H"                        # 0: H 降落标识

    # ============================================================
    # 圆筒检测精确后处理 (OpenCV)
    # ============================================================
    cylinder_refine_enable: true        # 启用 YOLO 框内 OpenCV 精修
    cylinder_edge_blur: 3               # 边缘检测前高斯模糊核大小 (降噪)
    cylinder_canny_low: 30              # Canny 低阈值 (降低以检测更多边缘)
    cylinder_canny_high: 120            # Canny 高阈值
    cylinder_min_radius_ratio: 0.15     # 椭圆最小半径 / bbox 半宽 (放宽)
    cylinder_max_radius_ratio: 1.5      # 椭圆最大半径 / bbox 半宽
    cylinder_white_brightness: 100      # 白色验证: V 通道最低值 (放宽)
    cylinder_tracking_max_age: 10       # 多帧追踪: 最大消失帧数
    cylinder_tracking_iou_thresh: 0.3   # 多帧追踪: IoU 匹配阈值
    cylinder_tracking_min_hits: 3       # 多帧追踪: 连续命中N帧后才输出 (过滤闪烁假目标)

    # ============================================================
    # H 降落标识精确后处理 (OpenCV)
    # ============================================================
    landing_refine_enable: true         # 启用 YOLO 框内 OpenCV 精修
    landing_adaptive_thresh_block: 11   # 自适应阈值块大小
    landing_circle_min_area: 80         # 5m高度下 H 笔画最小面积 (px²)
    landing_H_orientation_enable: true  # 估计 H 的偏航方向

    # ============================================================
    # 视觉伺服 (IBVS 精准降落) 参数
    # ============================================================
    servo_kp: 0.5                       # 比例增益 (m/s per m error)
    servo_ki: 0.02                      # 积分增益
    servo_kd: 0.1                       # 微分增益
    servo_max_horizontal_vel: 1.0       # 最大水平修正速度 (m/s)
    servo_descent_speed: 0.3            # 下降速度 (m/s)
    servo_integral_max: 0.5             # 积分项限幅
    servo_target_deadzone: 0.03         # 目标死区 (m), 进入后停止水平修正

    # ============================================================
    # 覆盖监控参数 (场地局部 forward/right 坐标)
    # ============================================================
    # Home 是局部坐标原点；layout_heading_deg: NED 北为0°, 顺时针为正
    home_x: 4.0
    home_y: 10.0
    layout_heading_deg: 0.0
    coverage_zone_forward_min: 55.0     # 侦察区局部前方下限 (m)
    coverage_zone_forward_max: 60.0     # 侦察区局部前方上限 (m)
    coverage_zone_right_min: -4.0       # 侦察区局部右侧下限 (m)
    coverage_zone_right_max: 4.0        # 侦察区局部右侧上限 (m)
    coverage_grid_resolution: 0.5       # 网格分辨率 (m)
    coverage_fov_half_angle: 35.0       # 相机 FOV 半角 (度)
    coverage_complete_ratio: 0.95       # 全覆盖判定阈值
