/vision_pipeline:
  ros__parameters:
    # bucket 配置的相机机体 FRD 安装偏移与额外姿态（弧度）。
    # 现场报告镜头水平偏移为 0、光轴朝正下方，O 点距地约 40 cm，镜头中心距地 3-4 cm。
    # blue 配置不读取这些值，保持已飞过的投影行为。
    bucket_camera_forward: 0.0   # m；现场报告值
    bucket_camera_right: 0.0     # m；现场报告值
    bucket_home_body_height: 0.40 # m；与任务节点保持一致，供起飞地面平面定位
    bucket_camera_down: 0.365    # m；O 到镜头中心向下 36-37 cm 的中值
    bucket_camera_roll: 0.0
    bucket_camera_pitch: 0.0
    bucket_camera_yaw: 0.0
    # 快速策略专用：YOLO 建锁/低频守护，OpenCV 跟踪圆形落区中心。
    landing_circle_track_enable: true
    landing_circle_tracker_roi_padding_px: 48
    landing_circle_tracker_min_edge_margin_px: 12.0
    landing_circle_tracker_max_center_jump_px: 80.0
    landing_circle_tracker_max_radius_change_ratio: 0.35
    landing_yolo_guard_rate_hz: 2.0
