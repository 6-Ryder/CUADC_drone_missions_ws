# 舵机快速双投参数 — drone_servo2 (C++) — quick 模式
#
# 投放序列 (quick: 取消步进, 一次直接打开):
#   初始:  1150μs — 闭合 (挂载两枚载荷)
#   投放1: 2150μs — 直接全开, 同时释放两枚
#
# 舵机只进不退, 每次投放移动到下一个 PWM 位置.
# pwm_positions 长度-1 = max_drops (mission quick 参数为 1).
#
# 时间预算: drop_timeout_s 3.0 - drop_delay_ms 0.5 = 2.5s 命令预算;
#   单次 ACK ≤1.25s, 2 次尝试 ≤3.0s < FSM drop_confirmation_timeout 5.0s ✓
#
# 架构: Jetson → DO_SET_ACTUATOR → px4_bridge → PX4 → MAIN5 PWM 50Hz → 舵机
# PX4 侧: MAIN5 = Peripheral via Actuator Set 1, PWM range 1150-2150μs
/servo_controller:
  ros__parameters:
    platform: "sitl"              # sitl | jetson  (真机 launch 会覆盖为 jetson)
    pwm_positions: [1150.0, 2150.0]  # quick: 一次全开双投 (μs)
    drop_delay_ms: 500.0          # 投放保持延时 (ms) — 减短加快节奏
    drop_timeout_s: 3.0           # ACK + 舵机保持的总时间预算 (s)
    command_retries: 1            # 仅 ACK 超时时重发同一绝对 PWM 一次
